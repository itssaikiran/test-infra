name: Terraform Plan

on:
  push:
    branches:
      - hello-world
    paths:
      - 'cloudathon/**'

jobs:
  # ✅ Checkov Scan Job
  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Install Python (Required for Checkov)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ✅ Install Checkov
      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      # ✅ Run Checkov (Enable logging and target specific framework)
      - name: Run Checkov
        run: |
          checkov -d ${{ github.workspace }}/cloudathon --framework terraform --verbose -o cli --soft-fail false

  # ✅ SonarCloud Scan Job
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # ✅ Set up JDK 17 (if needed)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Install Sonar Scanner
      - name: Install Sonar Scanner
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip
          curl -Lo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          sudo mv sonar-scanner-5.0.1.3006-linux /opt/sonar-scanner
          sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner
          sonar-scanner --version

      # ✅ Run Sonar Scanner
      - name: SonarCloud Scan
        run: |
          sonar-scanner \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ✅ Terraform Plan Job (Runs After SonarCloud Scan)
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: sonarcloud # ✅ Terraform Plan runs only after SonarCloud Scan passes

    steps:
      # ✅ Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Setup Google Cloud SDK
      - name: Setup GCP Authentication
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # ✅ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      # ✅ Initialize Terraform
      - name: Terraform Init
        run: terraform init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      # ✅ Format Terraform files
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # ✅ Validate Terraform configuration
      - name: Terraform Validate
        run: terraform validate

      # ✅ Generate Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
