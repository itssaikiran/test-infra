name: SonarCloud Scan

on:
  push:
    branches:
      - main
      #- hello-world  # Scan all branches
    paths:
      - 'cloudathon/**
permissions:
  contents: read
  pull-requests: read

jobs:
  # ✅ Trivy Scan Job
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cloudathon

    steps:
      # ✅ Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Install Trivy
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh

      # ✅ Run Trivy for Terraform Scanning
      - name: Trivy Scan Terraform Files
        run: |
          trivy config . --exit-code 1 --severity HIGH,CRITICAL --format table

      # # ✅ Run Trivy for Docker Scanning (Optional)
      # - name: Trivy Scan Docker Image
      #   run: |
      #     trivy image your-image-name:latest --exit-code 1 --severity HIGH,CRITICAL --format table

      # # ✅ Run Trivy for Kubernetes Scanning (Optional)
      # - name: Trivy Scan Kubernetes Manifests
      #   run: |
      #     trivy k8s cluster --report all
